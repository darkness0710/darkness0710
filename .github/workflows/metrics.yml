name: metrics

on:
  schedule: [{ cron: "0 17 * * 0" }]   # 00:00 thu Hai, gio VN (UTC+7)
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: darkness0710
          filename: metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Ho_Chi_Minh

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          # theme CSS/SCSS vendored, khong phai code minh viet
          plugin_languages_skipped: >-
            darkness0710.github.io,
            darkness0710.github.io.old,
            ousayshop_v1_vuex

          plugin_habits: yes
          plugin_habits_charts: yes
          # event cu tro toi commit da bi force-push xoa -> plugin crash
          plugin_habits_skipped: tool_hota-vod-cutter
          plugin_followup: yes
          plugin_achievements: yes
